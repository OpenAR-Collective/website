name: Sync Mission Supporters

# Publishing a Mission Supporter is a CiviCRM action: a reviewer adds the
# organization to "Mission Supporters - published". This workflow is what turns
# that into a change on openarcollective.org, so nobody has to run anything by
# hand. Withdrawals work the same way in reverse.
#
# Requires two repository secrets:
#   CIVI_API_KEY   the API key of a CiviCRM user that can view contacts
#   CIVI_SITE_KEY  CIVICRM_SITE_KEY from civicrm.settings.php
#
# Until both exist the job fails loudly rather than silently publishing nothing.

on:
  schedule:
    # Hourly. A roster is not time critical, and this keeps well clear of any
    # rate limiting on the CiviCRM host.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-supporters
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the secrets are present
        env:
          CIVI_API_KEY: ${{ secrets.CIVI_API_KEY }}
          CIVI_SITE_KEY: ${{ secrets.CIVI_SITE_KEY }}
        run: |
          missing=
          [ -n "$CIVI_API_KEY" ] || missing="$missing CIVI_API_KEY"
          [ -n "$CIVI_SITE_KEY" ] || missing="$missing CIVI_SITE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Read the roster from CiviCRM
        env:
          CIVI_BASE_URL: https://join.openarcollective.org
          CIVI_API_KEY: ${{ secrets.CIVI_API_KEY }}
          CIVI_SITE_KEY: ${{ secrets.CIVI_SITE_KEY }}
          CIVI_GROUP: supporters_published
        run: python scripts/sync-supporters.py

      - name: Commit and push any change
        run: |
          if [ -z "$(git status --porcelain src/content/supporters)" ]; then
            echo "Roster unchanged."
            exit 0
          fi
          git config user.name "openar-roster-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/supporters
          git commit -m "Update the Mission Supporter roster

          Written by the scheduled roster sync from the CiviCRM published group.
          Approving or withdrawing a supporter happens in CiviCRM; this commit is
          the result, not the decision."
          git push
          echo "Roster updated. Cloudflare Pages will deploy this push."
